<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesLore</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* SalesLore web console. Plan: evergreen rail on the left holds the seven product areas; the canvas is stone-grey paper.
   Briefs read like a handed-down dossier (serif), the app chrome is a plain sans.
   The one bold element: amber "receipt" tabs on every claim that unfold the source evidence in place. */
:root {
  --navy: #0F5C50;
  --navy-2: #137565;
  --sage: #12805C;
  --sage-soft: #DCF5E6;
  --amber: #965A00;
  --amber-soft: #FFF0CC;
  --sun: #FFB627;
  --stone: #F4F7F2;
  --paper: #FFFFFF;
  --ink: #14231F;
  --muted: #53645E;
  --line: #DCE5DE;
  --critical: #C2413B;
  --critical-soft: #FDE4E2;
  --unknown: #6B7570;
  --unknown-soft: #ECEFEC;
  --rail-ink: #FFFFFF;
  --rail-muted: #C6E4DA;
  --font-ui: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --font-doc: "Literata", Georgia, "Times New Roman", serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0C463D; --navy-2: #13695B; --sage: #62D3A3; --sage-soft: #163A2D;
    --amber: #FFC65A; --amber-soft: #3A2C0E; --sun: #FFB627; --stone: #0E1715; --paper: #15221F;
    --ink: #E8F2EE; --muted: #A2B7AF; --line: #24352F; --critical: #F08A84; --critical-soft: #3D1F1E;
    --unknown: #A9B3AE; --unknown-soft: #222C29; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0C463D; --navy-2: #13695B; --sage: #62D3A3; --sage-soft: #163A2D;
  --amber: #FFC65A; --amber-soft: #3A2C0E; --sun: #FFB627; --stone: #0E1715; --paper: #15221F;
  --ink: #E8F2EE; --muted: #A2B7AF; --line: #24352F; --critical: #F08A84; --critical-soft: #3D1F1E;
  --unknown: #A9B3AE; --unknown-soft: #222C29; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--stone); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.rail { background: var(--navy); color: var(--rail-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { padding: 0 10px; }
.brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.brand .mark { width: 36px; height: 36px; flex: none; }
.brand strong { font-size: 21px; letter-spacing: -0.01em; font-weight: 700; display: block; }
.brand span { color: var(--rail-muted); font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: var(--rail-ink); text-decoration: none; padding: 9px 10px; border-radius: 7px; display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; }
.nav a small { color: var(--rail-muted); font-size: 12px; }
.nav a:hover { background: var(--navy-2); }
.nav a[aria-current="page"] { background: var(--navy-2); box-shadow: inset 4px 0 0 var(--sun); font-weight: 600; }
.rail-foot { margin-top: auto; padding: 10px; font-size: 12.5px; color: var(--rail-muted); border-top: 1px solid var(--navy-2); }
.rail-foot b { color: var(--rail-ink); font-weight: 600; }
.main { min-width: 0; }
.banner { background: var(--sun); color: #14231F; color: var(--ink); padding: 8px 28px; font-size: 13px; border-bottom: 1px solid var(--line); }
.view { padding: 28px; max-width: 1180px; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.view-head h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.015em; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.pad { padding: 18px 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.split { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); margin-bottom: 18px; }
.stat { padding: 14px 18px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-size: 24px; color: var(--navy-2); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--sage-soft) 45%, transparent); }
.num { text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-ready { background: var(--sage-soft); color: var(--sage); }
.s-review { background: var(--amber-soft); color: var(--amber); }
.s-risk { background: var(--amber-soft); color: var(--amber); }
.s-stop { background: var(--critical-soft); color: var(--critical); }
.s-unknown { background: var(--unknown-soft); color: var(--unknown); }
.s-approved { background: var(--navy); color: #fff; }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); white-space: nowrap; }
.btn { border: 1px solid var(--navy); background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 7px; font-weight: 600; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.acct-list { display: flex; flex-direction: column; }
.acct-list button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 16px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.acct-list button:last-child { border-bottom: 0; }
.acct-list button[aria-pressed="true"] { background: var(--sage-soft); }
.acct-list small { color: var(--muted); display: block; font-size: 12.5px; }
/* The dossier */
.dossier { font-family: var(--font-doc); font-size: 16px; line-height: 1.62; }
.dossier h2 { font-family: var(--font-ui); font-size: 22px; font-weight: 700; }
.dossier h3 { font-family: var(--font-ui); font-size: 14px; font-weight: 700; margin: 22px 0 8px; color: var(--ink); }
.dossier .meta { font-family: var(--font-ui); color: var(--muted); font-size: 13.5px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dossier ul, .dossier ol { margin: 0; padding-left: 20px; }
.dossier li { margin: 6px 0; }
.notice { font-family: var(--font-ui); font-size: 14px; border-radius: 8px; padding: 10px 14px; margin-top: 14px; border-left: 4px solid; }
.notice.stop { background: var(--critical-soft); border-color: var(--critical); }
.notice.warn { background: var(--amber-soft); border-color: var(--amber); }
.notice.unk { background: var(--unknown-soft); border-color: var(--unknown); }
.notice.ok { background: var(--sage-soft); border-color: var(--sage); }
.unknown-val { color: var(--unknown); font-style: italic; }
/* Receipts: the signature element */
.rc { font-family: var(--font-code); font-size: 11px; font-weight: 500; background: var(--sun); color: #14231F; border: 1px solid #E09A00; border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }
.rc[aria-expanded="true"] { background: #14231F; color: var(--sun); }
.receipt { display: block; font-family: var(--font-ui); font-size: 13.5px; margin: 6px 0 4px; padding: 9px 12px; background: var(--paper); border: 1px dashed #E5A800; border-left: 4px solid var(--sun); border-radius: 6px; }
.receipt q { font-family: var(--font-doc); font-style: italic; }
.receipt .src { color: var(--muted); font-size: 12.5px; display: block; margin-top: 3px; }
.step-tag { font-family: var(--font-ui); font-size: 12px; color: var(--sage); font-weight: 600; margin-left: 6px; white-space: nowrap; }
/* Pipeline */
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stage { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 12px 14px; transition: background .25s, border-color .25s; }
.stage b { display: block; font-size: 15px; }
.stage span { font-size: 12.5px; color: var(--muted); }
.stage.active { border-color: var(--amber); background: var(--amber-soft); }
.stage.done { border-color: var(--sage); background: var(--sage-soft); }
.stage.fail { border-color: var(--critical); background: var(--critical-soft); }
.log { font-size: 13.5px; list-style: none; margin: 0; padding: 0; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.log li:last-child { border-bottom: 0; }
.log .who { font-weight: 600; }
.log .bad { color: var(--critical); }
/* Graph */
.graph-wrap { overflow-x: auto; }
svg.graph { width: 100%; min-width: 640px; height: auto; display: block; }
.g-node { cursor: pointer; }
.g-node rect { stroke-width: 1.4; }
.g-node:focus-visible rect { stroke: var(--amber); stroke-width: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
/* Companion */
.slackwin { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-radius: 10px; overflow: hidden; border: 1px solid #DDDDDD; background: #FFFFFF; color: #1D1C1D; }
.slackwin .side { background: #3F0E40; color: #CFC3CF; padding: 14px 0; font-size: 14px; }
.slackwin .ws { color: #fff; font-weight: 700; font-size: 16px; padding: 0 16px 12px; border-bottom: 1px solid #5B2C5C; margin-bottom: 10px; }
.slackwin .grp { padding: 8px 16px 4px; font-size: 13px; color: #CFC3CF; }
.slackwin .ch { padding: 4px 16px; }
.slackwin .ch.on { background: #1164A3; color: #fff; font-weight: 600; }
.slackwin .ch.slack-app::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2EB67D; margin-right: 8px; }
.slackwin .chat { height: 600px; background: #FFFFFF; color: #1D1C1D; }
.slackwin .chat-head { border-color: #DDDDDD; }
.slackwin .chat-head span, .slackwin .msg .who small { color: #616061; }
.slackwin .chips, .slackwin .compose { border-color: #DDDDDD; }
.slackwin .chips button { background: #F8F8F8; border-color: #DDDDDD; color: #1D1C1D; }
.slackwin .compose input { background: #FFFFFF; border-color: #BBBBBB; color: #1D1C1D; }
.slackwin .compose .btn { background: #007A5A; border-color: #007A5A; color: #fff; }
.slackwin .av.bot { background: #ECB22E; color: #1D1C1D; box-shadow: none; }
.slackwin .av.leo { background: #2EB67D; }
.slackwin .msg .muted, .slackwin .receipt .src { color: #616061; }
.slackwin .receipt { background: #F8F8F8; color: #1D1C1D; }
@media (max-width: 980px) { .slackwin { grid-template-columns: 1fr; } .slackwin .side { display: none; } }
.slack-bar { display: flex; align-items: center; gap: 12px; background: #3F0E40; color: #fff; padding: 14px 18px; border-radius: 10px; margin-bottom: 12px; }
.slack-bar b { font-size: 17px; letter-spacing: -0.01em; }
.slack-bar span { font-size: 13px; opacity: .85; }
.slack-bar .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sun); flex: none; }
.chat { display: flex; flex-direction: column; height: 600px; }
.chat-head { padding: 12px 18px; border-bottom: 1px solid var(--line); font-weight: 600; }
.chat-head span { color: var(--muted); font-weight: 400; font-size: 13px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
.av { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.av.leo { background: var(--sage); }
.av.bot { background: var(--navy); box-shadow: inset 0 -4px 0 var(--sun); }
.msg .who { font-weight: 700; font-size: 14px; }
.msg .who small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.msg .body { font-size: 14.5px; }
.msg .body ul, .msg .body ol { margin: 4px 0; padding-left: 20px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--line); }
.chips button { border: 1px solid var(--line); background: var(--stone); color: var(--ink); border-radius: 99px; padding: 5px 11px; font-size: 13px; }
.compose { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.compose input { flex: 1; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--stone); color: var(--ink); font: inherit; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 14px; max-width: 360px; box-shadow: 0 6px 24px rgba(15,24,40,.25); }
.pattern { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.pattern:last-child { border-bottom: 0; }
.pattern h3 { font-size: 15.5px; font-weight: 600; }
.pattern p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.pattern.rejected h3 { text-decoration: line-through; color: var(--muted); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.muted { color: var(--muted); }
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 10px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav a small, .rail-foot { display: none; }
  .split, .grid2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(odd) { border-left: 0; }
  .stages { grid-template-columns: repeat(2, 1fr); }
  .view { padding: 18px 16px; }
  .banner { padding: 8px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
.who-pick { margin-top: 8px; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--navy-2); background: var(--navy-2); color: #fff; font: inherit; font-size: 13px; }
.error { background: var(--critical-soft); border-left: 4px solid var(--critical); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
.mode-chip { display: inline-block; margin-left: 6px; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.16); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="SalesLore">
    <div class="brand"><div class="brand-row"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <rect width="64" height="64" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M32 21 L19 39"/>
    <path d="M32 21 L45 39"/>
    <path d="M19 39 L32 49"/>
    <path d="M45 39 L32 49"/>
  </g>
  <circle cx="32" cy="19" r="7.5" fill="#FFB627"/>
  <circle cx="19" cy="40" r="5.5" fill="#FFFFFF"/>
  <circle cx="45" cy="40" r="5.5" fill="#FFFFFF"/>
  <circle cx="32" cy="49.5" r="4.5" fill="#DCF5E6"/>
</svg>
<strong>SalesLore</strong></div><span>Your best sellers' knowledge. Never lost.</span></div>
    <nav class="nav" id="nav">
      <a href="#overview">Overview <small>Coverage</small></a>
      <a href="#sellers">Sellers <small>Seller DNA</small></a>
      <a href="#accounts">Accounts <small>Account Memory</small></a>
      <a href="#graph">Knowledge Graph</a>
      <a href="#transfers">Transfers <small>Agents</small></a>
      <a href="#companion">Companion <small>Slack</small></a>
      <a href="#governance">Governance <small>Ledger</small></a>
    </nav>
    <div class="rail-foot"><label for="who">Signed in as</label>
      <select id="who" class="who-pick"></select>
      <div style="margin-top:8px">Data: <b id="mode">loading</b></div></div>
  </aside>
  <main class="main">
    <div class="banner" id="banner">Synthetic demo data. Every company, person, quote and number is fictional.</div>
    <div class="view" id="view"><p class="muted">Loading SalesLore...</p></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
