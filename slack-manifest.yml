# Create the Slack app from this manifest: https://api.slack.com/apps > Create New App > From a manifest.
display_information:
  name: SalesLore
  description: Your best sellers' knowledge. Never lost. Cited briefs for inherited accounts.
  background_color: "#0f5c50"
features:
  bot_user:
    display_name: SalesLore
    always_online: true
  slash_commands:
    - command: /saleslore
      description: Briefs, next steps and answers for inherited accounts
      usage_hint: "brief Halcyon Freight | next Lumen Robotics | ask who decides at Marlow? | run Halcyon Freight"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
