name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Seed files are up to date
        run: |
          python3 data/generate_data.py
          npm run build:fixtures
          git diff --exit-code -- data db salesforce fixtures
      - run: npm test
